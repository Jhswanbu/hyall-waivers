<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYALL Player Waiver Requests</title>
<style>
  :root { --navy:#0f3550; --teal:#126e82; --ink:#1c2733; --muted:#5b6b7a; --line:#d7dee5;
          --bg:#f4f6f8; --ok:#1e7d32; --warn:#b26a00; --bad:#b3261e; --chip:#e8eef3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { max-width:880px; margin:0 auto; padding:20px 16px 48px; }
  header.top { background:var(--navy); color:#fff; padding:18px 0; }
  header.top .wrap { padding-top:0; padding-bottom:0; }
  header.top h1 { margin:0; font-size:22px; }
  header.top p { margin:4px 0 0; color:#c9d8e2; font-size:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin:16px 0; }
  .card h2 { margin:0 0 6px; font-size:18px; color:var(--navy); }
  .card h3 { margin:16px 0 6px; font-size:15px; color:var(--navy); }
  .notice { background:#fdf6e3; border:1px solid #e5cf8a; border-radius:10px; padding:14px 16px; margin:16px 0; font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; color:var(--ink); }
  label span.req { color:var(--bad); }
  input, select, textarea { width:100%; font-size:16px; padding:9px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); }
  textarea { min-height:84px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:640px){ .row { grid-template-columns:1fr; } }
  button, .btn { display:inline-block; background:var(--teal); color:#fff; border:0; border-radius:8px;
    padding:10px 16px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; }
  button.secondary, .btn.secondary { background:#fff; color:var(--teal); border:1px solid var(--teal); }
  button:disabled { opacity:.55; cursor:default; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .chip { display:inline-block; background:var(--chip); color:var(--navy); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:700; }
  .chip.ok { background:#e2f2e4; color:var(--ok); }
  .chip.warn { background:#fdf0dc; color:var(--warn); }
  .chip.bad { background:#fbe7e5; color:var(--bad); }
  .tracker { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 2px; }
  .tracker .step { flex:1 1 100px; text-align:center; font-size:12px; font-weight:700; color:var(--muted);
    border-top:4px solid var(--line); padding-top:6px; }
  .tracker .step.done { color:var(--ok); border-top-color:var(--ok); }
  .tracker .step.now { color:var(--navy); border-top-color:var(--teal); }
  dl { display:grid; grid-template-columns:170px 1fr; gap:4px 12px; margin:8px 0; font-size:14px; }
  @media (max-width:640px){ dl { grid-template-columns:1fr; } dl dd { margin:0 0 6px; } }
  dl dt { color:var(--muted); font-weight:600; }
  dl dd { margin:0; }
  .linkrow { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .linkrow code { flex:1 1 260px; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:12px; word-break:break-all; }
  .sigline { font-size:14px; padding:8px 0; border-bottom:1px solid var(--line); }
  .sigline:last-child { border-bottom:0; }
  .radio { display:flex; gap:8px; align-items:center; font-weight:500; font-size:15px; margin:8px 0; }
  .radio input { width:auto; }
  .check { display:flex; gap:8px; align-items:flex-start; font-weight:500; font-size:14px; margin:12px 0; }
  .check input { width:auto; margin-top:3px; }
  .noticebox { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:14px; font-size:14px; line-height:1.5; }
  .reqitem { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:14px 16px; margin:10px 0; cursor:pointer; color:var(--ink); }
  .reqitem:hover { border-color:var(--teal); }
  .reqitem .t { font-size:16px; font-weight:700; color:var(--navy); }
  .reqitem .s { font-size:13px; color:var(--muted); margin-top:2px; }
  .err { background:#fbe7e5; border:1px solid #e5a49e; color:var(--bad); border-radius:8px; padding:12px 14px; margin:16px 0; font-size:14px; }
  .fine { font-size:13px; color:var(--muted); }
  .hidden { display:none; }
  @media print { .no-print { display:none !important; } body { background:#fff; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>HYALL Player Waiver Requests</h1>
  <p>Houston Youth Area Lacrosse League &mdash; player waiver petitions under the HYALL bylaws</p>
</div></header>
<div class="wrap" id="app"><p>Loading&hellip;</p></div>

<script>
"use strict";
var SUPABASE_URL = "https://corykqppkigfrmbgeiuv.supabase.co";
var SUPABASE_KEY = "sb_publishable_QpAlJecohjUl8Qg5_edyyg_-whu0XDH";
var BASE = location.origin + location.pathname;

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtDate(d){ if(!d) return "";
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));
  if(m){ var xd = new Date(+m[1], +m[2] - 1, +m[3]);
    return xd.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}); }
  var x = new Date(d);
  return isNaN(x) ? esc(d) : x.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}); }
function fmtDT(d){ if(!d) return ""; var x = new Date(d);
  return isNaN(x) ? esc(d) : x.toLocaleString("en-US",{year:"numeric",month:"long",day:"numeric",
    hour:"numeric",minute:"2-digit"}); }

function rpc(fn, body){
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
               "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function(res){
    return res.text().then(function(t){
      if(!res.ok) throw new Error("Request failed (" + res.status + ") " + t);
      return t ? JSON.parse(t) : null;
    });
  });
}

function statusInfo(r){
  if(r.board_decision) return { label: "Decided — " + r.board_decision, cls: r.board_decision === "APPROVED" ? "ok" : (r.board_decision === "DENIED" ? "bad" : "warn") };
  if(r.status === "with_board") return { label: "With Executive Board", cls: "warn" };
  var missing = [];
  if(!r.parent_sig_at) missing.push("parent signature");
  if(!r.releasing_sig_at) missing.push("releasing president");
  if(!r.receiving_sig_at) missing.push("receiving president");
  return { label: "Waiting on: " + missing.join(", "), cls: "" };
}

function trackerHTML(r){
  var steps = [
    { name: "Submitted", done: true },
    { name: "Parent", done: !!r.parent_sig_at, now: !r.parent_sig_at },
    { name: "Programs", done: !!(r.releasing_sig_at && r.receiving_sig_at),
      now: !!r.parent_sig_at && !(r.releasing_sig_at && r.receiving_sig_at) },
    { name: "Board", done: !!r.board_decision, now: r.status === "with_board" },
    { name: "Decision", done: !!r.board_decision }
  ];
  var out = '<div class="tracker">';
  steps.forEach(function(s){
    out += '<div class="step' + (s.done ? " done" : (s.now ? " now" : "")) + '">' + s.name + "</div>";
  });
  return out + "</div>";
}

function detailsHTML(r){
  function row(k, v){ return v ? "<dt>" + k + "</dt><dd>" + esc(v) + "</dd>" : ""; }
  var out = "<dl>";
  out += row("Player", r.player_name);
  out += row("Date of birth", fmtDate(r.player_dob));
  out += row("Parent / guardian", r.parent_name);
  out += row("Parent email", r.parent_email);
  out += row("Parent phone", r.parent_phone);
  out += row("Home address", r.home_address);
  out += row("Residence ISD", r.residence_isd);
  out += row("Assigned organization", r.assigned_org);
  out += row("School attending", r.school_attending);
  out += row("School type", r.school_type);
  out += row("Waiver category", r.waiver_category);
  out += row("Reason", r.reason);
  out += row("Submitted by", (r.submitter_name || "") + (r.submitter_org ? " (" + r.submitter_org + ")" : ""));
  out += row("Submitted", fmtDT(r.created_at));
  if(r.date_received) out += row("Received by Executive Board", fmtDate(r.date_received));
  return out + "</dl>";
}

function signaturesHTML(r){
  function line(label, sigName, sigAt, extra){
    if(sigAt) return '<div class="sigline"><strong>' + label + ':</strong> signed by ' + esc(sigName || "") +
      " on " + fmtDT(sigAt) + (extra ? " — " + esc(extra) : "") + "</div>";
    return '<div class="sigline"><strong>' + label + ':</strong> <span class="fine">awaiting signature</span></div>';
  }
  var out = "<h3>Signatures</h3>";
  out += line("Parent / guardian", r.parent_sig_name, r.parent_sig_at, "");
  out += line("Releasing president (" + (r.releasing_org || "assigned org") + ")",
              r.releasing_sig_name, r.releasing_sig_at, r.releasing_decision);
  out += line("Receiving president (" + (r.receiving_org || "receiving org") + ")",
              r.receiving_sig_name, r.receiving_sig_at, r.receiving_decision);
  if(r.board_decision){
    out += '<div class="sigline"><strong>Executive Board:</strong> ' + esc(r.board_decision) +
      (r.vote_tally ? " (vote " + esc(r.vote_tally) + ")" : "") + " — recorded by " +
      esc(r.board_signee || "") + " on " + fmtDT(r.board_decided_at) +
      (r.proof_of_residency ? "; proof of residency: " + esc(r.proof_of_residency) : "") + "</div>";
  }
  return out;
}

function buildNotice(r){
  var lines = [];
  var approved = r.board_decision === "APPROVED";
  lines.push("HOUSTON YOUTH AREA LACROSSE LEAGUE (HYALL)");
  lines.push("Player Waiver Request — Final " + (approved ? "Approval" : (r.board_decision === "DENIED" ? "Denial" : "Board Decision")));
  lines.push("");
  lines.push("Player: " + (r.player_name || ""));
  lines.push("Waiver category: " + (r.waiver_category || ""));
  lines.push("Assigned organization: " + (r.assigned_org || ""));
  lines.push("Receiving organization: " + (r.receiving_org || ""));
  lines.push("");
  lines.push("The HYALL Executive Board has reviewed this waiver request and voted " +
    r.board_decision + (r.vote_tally ? " (" + r.vote_tally + ")" : "") +
    " on " + fmtDate(r.board_decided_at) + ".");
  if(r.date_received) lines.push("Date received by the Executive Board: " + fmtDate(r.date_received) + ".");
  if(r.proof_of_residency) lines.push("Proof of residency on file: " + r.proof_of_residency + ".");
  lines.push("");
  lines.push(approved
    ? "This waiver is approved. The player may participate with the receiving organization under the terms of the HYALL bylaws."
    : "This waiver was not approved. Questions about this decision may be directed to the HYALL Executive Board.");
  lines.push("");
  lines.push("Recorded by: " + (r.board_signee || "") + ", HYALL Executive Board");
  lines.push("");
  lines.push("Signatures on file:");
  lines.push("- Parent/guardian: " + (r.parent_sig_name || "") + " (" + fmtDate(r.parent_sig_at) + ")");
  lines.push("- Releasing president: " + (r.releasing_sig_name || "") + " — " + (r.releasing_decision || ""));
  lines.push("- Receiving president: " + (r.receiving_sig_name || "") + " — " + (r.receiving_decision || ""));
  return lines.join("\n");
}

function noticeHTML(r){
  var emails = [r.parent_email, r.releasing_email, r.receiving_email, r.submitter_email]
    .filter(function(e, i, a){ return e && a.indexOf(e) === i; });
  var subject = "HYALL Waiver Request — " + r.board_decision + ": " + (r.player_name || "");
  var mailto = "mailto:" + emails.join(",") + "?subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(buildNotice(r));
  return '<h3>Final notice to all parties</h3>' +
    '<div class="noticebox" id="noticeText">' + esc(buildNotice(r)) + "</div>" +
    '<div class="actions no-print">' +
    '<a class="btn" href="' + mailto + '">Open in Email</a>' +
    '<button class="secondary" onclick="copyText(document.getElementById(\'noticeText\').innerText)">Copy notice</button>' +
    '<button class="secondary" onclick="window.print()">Print</button></div>' +
    '<p class="fine">Addressed to: ' + esc(emails.join(", ")) + "</p>";
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ alert("Copied."); }, function(){ legacyCopy(t); });
  } else legacyCopy(t);
}
function legacyCopy(t){
  var ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); alert("Copied."); } catch(e){ alert("Copy failed — select the text manually."); }
  document.body.removeChild(ta);
}
function copyLink(id){ var el = document.getElementById(id); if(el) copyText(el.textContent); }

function errorBox(msg){ return '<div class="err">' + esc(msg) + "</div>"; }
</script>

<script>
"use strict";
var CATEGORIES = ["Geographic Proximity","Private School","Associate Member","Associate Member Sibling",
  "ISD Employment","Female Athlete","(Late) Roster","Substitution for Injury","Medical/Developmental"];
var SCHOOL_TYPES = ["Public","Private","Parochial","Charter","Home School"];

function field(label, id, opts){
  opts = opts || {};
  var req = opts.req ? ' <span class="req">*</span>' : "";
  var input;
  if(opts.type === "select"){
    input = '<select id="' + id + '">' + (opts.blank ? '<option value=""></option>' : "") +
      opts.options.map(function(o){ return '<option' + (opts.value === o ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select>";
  } else if(opts.type === "textarea"){
    input = '<textarea id="' + id + '">' + esc(opts.value || "") + "</textarea>";
  } else {
    input = '<input id="' + id + '" type="' + (opts.type || "text") + '" value="' + esc(opts.value || "") + '"' +
      (opts.autocomplete ? ' autocomplete="' + opts.autocomplete + '"' : "") + ">";
  }
  return "<div><label for=\"" + id + "\">" + label + req + "</label>" + input + "</div>";
}

function landingView(){
  var app = document.getElementById("app");
  var catOpts = CATEGORIES.map(function(c){ return "<option>" + esc(c) + "</option>"; }).join("");
  var typeOpts = SCHOOL_TYPES.map(function(c){ return "<option>" + esc(c) + "</option>"; }).join("");
  app.innerHTML =
    '<div class="notice"><strong>Notice (HYALL bylaws):</strong> Waiver petitions may be submitted only by an ' +
    'Organization President. Both the releasing and receiving Organization Presidents must review and endorse ' +
    'the request before it goes to the Executive Board. Petitions submitted directly by parents or coaches ' +
    'will not be processed.</div>' +
    '<div class="card"><h2>How it works</h2>' +
    '<p class="fine">1. A president submits the request below. &nbsp;2. The parent and both presidents sign ' +
    'through their own private links. &nbsp;3. Once all three signatures are in, the request goes to the ' +
    'Executive Board automatically. &nbsp;4. The Board records its vote, and a final notice is generated ' +
    'for all parties.</p>' +
    '<p class="fine">Executive Board members: open your board link to see the dashboard.</p></div>' +
    '<form id="createForm" class="card"><h2>Submit a waiver request</h2>' +
    "<h3>Submitted by (Organization President)</h3><div class=\"row\">" +
    field("Your name", "submitter_name", { req: true }) +
    field("Your organization", "submitter_org", { req: true }) +
    field("Your email", "submitter_email", { req: true, type: "email" }) +
    "</div>" +
    "<h3>Section 1 — Player &amp; family</h3><div class=\"row\">" +
    field("Player name", "player_name", { req: true }) +
    field("Player date of birth", "player_dob", { type: "date" }) +
    field("Parent / guardian name", "parent_name", { req: true }) +
    field("Parent / guardian email", "parent_email", { req: true, type: "email" }) +
    field("Parent phone", "parent_phone", { type: "tel" }) +
    field("Home address", "home_address") +
    "</div>" +
    "<h3>Section 2 — Boundary &amp; school zoning</h3><div class=\"row\">" +
    field("Residence ISD", "residence_isd") +
    field("Assigned organization (by boundary)", "assigned_org") +
    field("School attending", "school_attending") +
    '<div><label for="school_type">School type</label><select id="school_type"><option value=""></option>' + typeOpts + "</select></div>" +
    "</div>" +
    "<h3>Section 3 — Waiver requested</h3>" +
    '<div><label for="waiver_category">Waiver category <span class="req">*</span></label>' +
    '<select id="waiver_category"><option value=""></option>' + catOpts + "</select></div>" +
    field("Reason for the waiver", "reason", { type: "textarea" }) +
    "<h3>Releasing program (assigned organization)</h3><div class=\"row\">" +
    field("Releasing organization", "releasing_org") +
    field("Releasing president name", "releasing_president") +
    field("Releasing president email", "releasing_email", { req: true, type: "email" }) +
    "</div>" +
    "<h3>Receiving program</h3><div class=\"row\">" +
    field("Receiving organization", "receiving_org") +
    field("Receiving president name", "receiving_president") +
    field("Receiving president email", "receiving_email", { req: true, type: "email" }) +
    "</div>" +
    '<div id="formErr"></div>' +
    '<div class="actions"><button type="submit" id="submitBtn">Submit waiver request</button></div>' +
    '<p class="fine">On submit you will get a private signing link for the parent and for each president, ' +
    'plus a view-only status link. Send each signing link only to the person it belongs to.</p>' +
    "</form>";
  document.getElementById("createForm").addEventListener("submit", submitCreate);
}

function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }

function submitCreate(ev){
  ev.preventDefault();
  var payload = {};
  ["player_name","player_dob","parent_name","parent_email","parent_phone","home_address",
   "residence_isd","assigned_org","school_attending","school_type","waiver_category","reason",
   "submitter_name","submitter_org","submitter_email",
   "releasing_org","releasing_president","releasing_email",
   "receiving_org","receiving_president","receiving_email"]
   .forEach(function(k){ payload[k] = val(k); });
  var required = ["player_name","parent_name","parent_email","waiver_category",
                  "submitter_name","submitter_org","submitter_email","releasing_email","receiving_email"];
  var missing = required.filter(function(k){ return !payload[k]; });
  var err = document.getElementById("formErr");
  if(missing.length){ err.innerHTML = errorBox("Please fill in every field marked *."); return; }
  var btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Submitting…";
  rpc("create_waiver", { p: payload }).then(function(res){
    successView(payload, res);
  }).catch(function(e){
    err.innerHTML = errorBox("The request could not be submitted. " + e.message);
    btn.disabled = false; btn.textContent = "Submit waiver request";
  });
}

function linkRow(label, id, link, email, mailSubject, mailBody){
  var mailto = email ? "mailto:" + email + "?subject=" + encodeURIComponent(mailSubject) +
    "&body=" + encodeURIComponent(mailBody) : "";
  return '<p style="margin:14px 0 2px"><strong>' + label + '</strong></p><div class="linkrow">' +
    '<code id="' + id + '">' + esc(link) + "</code>" +
    '<button type="button" class="secondary" onclick="copyLink(\'' + id + '\')">Copy</button>' +
    (email ? '<a class="btn secondary" href="' + mailto + '">Email this link</a>' : "") + "</div>";
}

function successView(p, res){
  var app = document.getElementById("app");
  var parentLink = BASE + "?k=" + res.token_parent;
  var relLink = BASE + "?k=" + res.token_releasing;
  var recLink = BASE + "?k=" + res.token_receiving;
  var viewLink = BASE + "?k=" + res.token_view;
  var subj = "HYALL Waiver Request — signature needed: " + p.player_name;
  function body(link, who){
    return "Hello,\n\nA HYALL player waiver request for " + p.player_name + " (" + p.waiver_category +
      ") needs your signature as " + who + ".\n\nOpen your private signing link:\n" + link +
      "\n\nPlease review the request and sign. This link is only for you — please do not forward it.\n\n" +
      "Submitted by " + p.submitter_name + " (" + p.submitter_org + ").";
  }
  app.innerHTML = '<div class="card"><h2>Request submitted — send the signing links</h2>' +
    "<p>The waiver request for <strong>" + esc(p.player_name) + "</strong> is in. It moves to the Executive " +
    "Board as soon as the parent and both presidents have signed.</p>" +
    '<p class="fine"><strong>Save these links now</strong> — they are shown only on this screen. Anyone with a ' +
    "signing link can sign that panel, so send each link only to the person it belongs to.</p>" +
    linkRow("Parent / guardian signing link", "lk1", parentLink, p.parent_email, subj, body(parentLink, "the parent/guardian")) +
    linkRow("Releasing president signing link (" + esc(p.releasing_org || "assigned org") + ")", "lk2", relLink, p.releasing_email, subj, body(relLink, "the releasing president")) +
    linkRow("Receiving president signing link (" + esc(p.receiving_org || "receiving org") + ")", "lk3", recLink, p.receiving_email, subj, body(recLink, "the receiving president")) +
    linkRow("View-only status link (share with anyone tracking this request)", "lk4", viewLink, "", "", "") +
    '<div class="actions no-print"><a class="btn secondary" href="' + BASE + '">Submit another request</a></div></div>';
  window.scrollTo(0, 0);
}
</script>

<script>
"use strict";
function requestCardHTML(r){
  var si = statusInfo(r);
  return "<h2>Waiver request — " + esc(r.player_name) + "</h2>" +
    '<p><span class="chip ' + si.cls + '">' + esc(si.label) + "</span> &nbsp;" +
    '<span class="fine">' + esc(r.waiver_category || "") + "</span></p>" +
    trackerHTML(r) + detailsHTML(r) + signaturesHTML(r);
}

function tokenView(token){
  var app = document.getElementById("app");
  rpc("get_waiver", { p_token: token }).then(function(r){
    if(!r){ app.innerHTML = '<div class="card">' + errorBox("This link doesn't match any waiver request. Check the link and try again.") + "</div>"; return; }
    renderToken(r, token);
  }).catch(function(e){
    app.innerHTML = '<div class="card">' + errorBox("Could not load this request. " + e.message) + "</div>";
  });
}

function renderToken(r, token){
  var app = document.getElementById("app");
  var panel = "";
  if(r.role === "parent" && !r.parent_sig_at){
    panel = '<div class="card"><h3>Parent / guardian signature</h3>' +
      '<p class="fine">By signing, I acknowledge this waiver request for my child and consent to it being ' +
      'reviewed by the releasing and receiving organizations and the HYALL Executive Board.</p>' +
      '<label class="check"><input type="checkbox" id="ack"> I am the parent or legal guardian of ' +
      esc(r.player_name) + ' and I agree to this waiver request.</label>' +
      field("Type your full name to sign", "sigName", { value: r.parent_name || "" }) +
      '<div id="sigErr"></div><div class="actions"><button id="signBtn">Sign as parent / guardian</button></div></div>';
  } else if(r.role === "releasing" && !r.releasing_sig_at){
    panel = '<div class="card"><h3>Releasing president endorsement — ' + esc(r.releasing_org || "") + "</h3>" +
      '<label class="radio"><input type="radio" name="relDec" value="Approved / Released"> Approved / Released</label>' +
      '<label class="radio"><input type="radio" name="relDec" value="Denied / Objected"> Denied / Objected</label>' +
      field("Type your full name to sign", "sigName", { value: r.releasing_president || "" }) +
      '<div id="sigErr"></div><div class="actions"><button id="signBtn">Sign endorsement</button></div></div>';
  } else if(r.role === "receiving" && !r.receiving_sig_at){
    panel = '<div class="card"><h3>Receiving president endorsement — ' + esc(r.receiving_org || "") + "</h3>" +
      '<label class="radio"><input type="radio" name="recDec" value="Accepted"> Accepted</label>' +
      '<label class="radio"><input type="radio" name="recDec" value="Declined"> Declined</label>' +
      field("Type your full name to sign", "sigName", { value: r.receiving_president || "" }) +
      '<div id="sigErr"></div><div class="actions"><button id="signBtn">Sign endorsement</button></div></div>';
  } else if(r.role === "view"){
    panel = '<p class="fine">This is a view-only status link — signatures happen through each person\'s private signing link.</p>';
  } else {
    panel = '<p class="fine">Your signature is on file for this request.</p>';
  }
  var notice = r.board_decision ? '<div class="card">' + noticeHTML(r) + "</div>" : "";
  app.innerHTML = '<div class="card">' + requestCardHTML(r) + "</div>" + panel + notice;
  var btn = document.getElementById("signBtn");
  if(btn) btn.addEventListener("click", function(){ submitSignature(r, token); });
  window.scrollTo(0, 0);
}

function submitSignature(r, token){
  var err = document.getElementById("sigErr");
  var name = val("sigName");
  if(!name){ err.innerHTML = errorBox("Type your full name to sign."); return; }
  var btn = document.getElementById("signBtn");
  btn.disabled = true; btn.textContent = "Signing…";
  var call;
  if(r.role === "parent"){
    if(!document.getElementById("ack").checked){
      err.innerHTML = errorBox("Please check the acknowledgment box to sign.");
      btn.disabled = false; btn.textContent = "Sign as parent / guardian"; return;
    }
    call = rpc("sign_parent", { p_token: token, p_sig_name: name });
  } else if(r.role === "releasing"){
    var d1 = document.querySelector('input[name="relDec"]:checked');
    if(!d1){ err.innerHTML = errorBox("Choose Approved / Released or Denied / Objected."); btn.disabled = false; btn.textContent = "Sign endorsement"; return; }
    call = rpc("endorse_releasing", { p_token: token, p_decision: d1.value, p_sig_name: name });
  } else if(r.role === "receiving"){
    var d2 = document.querySelector('input[name="recDec"]:checked');
    if(!d2){ err.innerHTML = errorBox("Choose Accepted or Declined."); btn.disabled = false; btn.textContent = "Sign endorsement"; return; }
    call = rpc("endorse_receiving", { p_token: token, p_decision: d2.value, p_sig_name: name });
  }
  call.then(function(nr){
    if(!nr){ err.innerHTML = errorBox("This signature could not be recorded — the panel may already be signed."); btn.disabled = false; return; }
    renderToken(nr, token);
  }).catch(function(e){
    err.innerHTML = errorBox("Signing failed. " + e.message);
    btn.disabled = false; btn.textContent = "Try again";
  });
}

function boardView(key){
  var app = document.getElementById("app");
  app.innerHTML = "<p>Loading dashboard…</p>";
  rpc("board_list", { p_key: key }).then(function(list){
    if(!list){ app.innerHTML = '<div class="card">' + errorBox("That board link isn't recognized.") + "</div>"; return; }
    var out = '<div class="card"><h2>Executive Board dashboard</h2>';
    if(!list.length) out += '<p class="fine">No waiver requests yet.</p>';
    list.forEach(function(item){
      var when = fmtDate(item.created_at);
      out += '<button class="reqitem" data-id="' + item.id + '"><span class="t">' + esc(item.player_name) +
        '</span> <span class="chip">' + esc(item.status === "decided" ? (item.board_decision || "Decided") : item.status.replace("_", " ")) + "</span>" +
        '<div class="s">' + esc(item.waiver_category || "") + " · " + esc(item.assigned_org || "") +
        " → " + esc(item.receiving_org || "") + " · submitted " + esc(when) + "</div></button>";
    });
    out += "</div>";
    app.innerHTML = out;
    Array.prototype.forEach.call(app.querySelectorAll(".reqitem"), function(b){
      b.addEventListener("click", function(){ boardDetail(key, b.getAttribute("data-id")); });
    });
  }).catch(function(e){
    app.innerHTML = '<div class="card">' + errorBox("Could not load the dashboard. " + e.message) + "</div>";
  });
}

function boardDetail(key, id){
  var app = document.getElementById("app");
  app.innerHTML = "<p>Loading…</p>";
  rpc("board_get", { p_key: key, p_id: id }).then(function(r){
    if(!r){ app.innerHTML = '<div class="card">' + errorBox("Request not found.") + "</div>"; return; }
    var panel = "";
    if(r.status === "with_board" || r.status === "decided"){
      panel = '<div class="card"><h3>Executive Board decision</h3>' +
        '<div><label for="proof">Proof of residency</label><select id="proof">' +
        ["Utility Bill","School Enrollment","Other"].map(function(o){
          return "<option" + (r.proof_of_residency === o ? " selected" : "") + ">" + o + "</option>"; }).join("") +
        "</select></div>" +
        '<div><label for="decision">Board vote</label><select id="decision">' +
        ["APPROVED","DENIED","TABLED"].map(function(o){
          return "<option" + (r.board_decision === o ? " selected" : "") + ">" + o + "</option>"; }).join("") +
        "</select></div>" +
        field("Vote tally (e.g. 5–0)", "tally", { value: r.vote_tally || "" }) +
        field("Executive Board member recording the decision", "signee", { value: r.board_signee || "" }) +
        '<div id="boardErr"></div><div class="actions"><button id="decideBtn">' +
        (r.board_decision ? "Update decision" : "Record decision") + "</button></div></div>";
    } else {
      panel = '<div class="card"><p class="fine">The Board can record a decision once the parent and both ' +
        "presidents have signed and the request reaches the Board.</p></div>";
    }
    var notice = r.board_decision ? '<div class="card">' + noticeHTML(r) + "</div>" : "";
    app.innerHTML = '<p class="no-print"><button class="secondary" id="backBtn">← Back to dashboard</button></p>' +
      '<div class="card">' + requestCardHTML(r) + "</div>" + panel + notice;
    document.getElementById("backBtn").addEventListener("click", function(){ boardView(key); });
    var btn = document.getElementById("decideBtn");
    if(btn) btn.addEventListener("click", function(){
      var signee = val("signee");
      var err = document.getElementById("boardErr");
      if(!signee){ err.innerHTML = errorBox("Enter the name of the Executive Board member recording the decision."); return; }
      btn.disabled = true; btn.textContent = "Recording…";
      rpc("board_decide", { p_key: key, p_id: id, p_proof: val("proof"),
        p_decision: val("decision"), p_tally: val("tally"), p_signee: signee })
      .then(function(nr){
        if(!nr){ err.innerHTML = errorBox("The decision could not be recorded."); btn.disabled = false; return; }
        boardDetail(key, id);
      }).catch(function(e){
        err.innerHTML = errorBox("Recording failed. " + e.message);
        btn.disabled = false; btn.textContent = "Record decision";
      });
    });
    window.scrollTo(0, 0);
  }).catch(function(e){
    app.innerHTML = '<div class="card">' + errorBox("Could not load this request. " + e.message) + "</div>";
  });
}

(function init(){
  var q = new URLSearchParams(location.search);
  try {
    if(q.get("board")) boardView(q.get("board"));
    else if(q.get("k")) tokenView(q.get("k"));
    else landingView();
  } catch(e){
    document.getElementById("app").innerHTML = '<div class="card">' + errorBox(e.message) + "</div>";
  }
})();
</script>
</body>
</html>
